# Master Architecture Document (32-Day Sprint Edition)

## 1. Executive Summary
This document serves as the **Definitive Technical Reference** for the APIM Self-Service Portal. It captures the architecture of the system as implemented over the 30-day "Sprint 1", specifically focusing on the **"Reference Architecture"** pattern where internal storage is minimized in favor of referencing ADO and APIM as sources of truth.

---

## 2. Logical Data Model (ERD)
The system is backed by 11 core tables designed to track **Relationships** and **State**, not Content.

## 3. Scaling & Performance Strategy
How the system handles growth from 10 to 1 million operations.

### Frontend Scaling (Federation & Bundling)
The UI is not a monolith. It is designed for **Module Federation**.
*   **Decoupled Features:** The \`PolicyStudio\` and \`Inventory\` are built as isolated features with no direct internal dependencies.
*   **Scale Plan:** As the team grows, \`src/features/policy-studio\` can be extracted into a separate generic Git repository and published as \`@internal/policy-studio\`.
*   **Lazy Loading:** React \`Suspense\` is used to only load the heavy Monaco Editor when the user actually clicks "Edit XML".

### Backend Scaling (Statelessness & Async)
*   **Stateless API:** No session affinity is required. We can scale from 1 to 50 pods using **KEDA** based on CPU or Request Count triggers.
*   **Connection Pooling:** We use \`pg-pool\` to multiplex database connections, allowing thousands of concurrent requests to share a limited number of DB connections.
*   **Heavy Lifting Offload:**
    *   **Spec Parsing:** Handled by the generic \`ParserService\`. For very large specs (10MB+), this logic is designed to be moved to an Azure Function triggered by a Queue, keeping the API fast.

---

## 4. Reusability Strategy
We don't build "throwaway" code. Key components are designed for reuse across the enterprise.

### The Policy Intelligence Engine
The logic in \`features/policy-studio/core\` (XML Parsing, Validation) provides a generic "Two-Way Binding" between XML and JSON.
*   **Reuse:** This engine can be embedded into the IDE plugins (VS Code) or CI/CD pipelines to validate policies before they even reach the portal.

### The Spectral Analyzer
The backend validation logic (\`/analyze\`) wraps the open-source **Spectral** linter.
*   **Reuse:** The ruleset (\`.spectral.yaml\`) is shared. We can package this validation service as a CLI tool (\`npm install -g @internal/api-linter\`) so developers can run the exact same checks locally.

---

## 5. Security & Access Control
Deep defense layout using Zero Trust principles.

### Data Security (At Rest & In Transit)
*   **Key Vault References:** We **NEVER** store actual API keys or Secrets in the PostgreSQL database. We store a Key Vault Secret Identifier (\`https://kv.azure.net/secrets/my-key\`). The App authenticates via **Managed Identity** to resolve this only at runtime.
*   **TDE:** Azure PostgreSQL enforces Transparent Data Encryption.
*   **TLS 1.2+:** All internal traffic (App -> DB, App -> APIM) is encrypted.

### Access Control (RBAC & ABAC)
*   **Identity Source:** Entra ID is the only identity provider.
*   **Granularity:**
    *   **Team Level:** Access is granted to "Owners" via AD Group membership.
    *   **Scope Level:** A user who owns \`Product A\` cannot even *see* the generic "Edit" buttons for \`Product B\`.
    *   **OBO Flow:** The backend performs an "On-Behalf-Of" token exchange to ensure it only acts with the permissions of the calling user when talking to downstream Azure APIs.

---

## 6. Policy Studio Engine (Internal Architecture)
The Policy Studio is a **Hybrid XML/Visual Engine**.

\`\`\`mermaid
flowchart LR
    Visual["Visual Tiles"] -- Drag/Drop --> Generator["policyGenerator.ts"]
    Generator -- Generates XML --> XML["Monaco Editor"]
    XML -- On Save --> Analyzer["Spectral Linter"]
    Analyzer -- Valid --> Backend["Persistence API"]
\`\`\`

### Gap Analysis & Solution
*   **Problem:** "Visual editors break complex XML."
*   **Solution:** We implemented a \`CustomBlock\` preservation strategy. If the parser encounters an XML tag it doesn't recognize (e.g., a custom compiled logic), it wraps it in a "Raw Block" in the UI, ensuring no data loss on round-trip.

---

# Backend Engineer's Reference: Architecture & Scaling

## 1. Transactional Flow: The "Onboarding" SAGA
Creating a product is not a single DB insert. It is a distributed transaction across 3 systems. We manage this ensuring eventual consistency.

## 2. Microservices Decomposition Strategy
The current system is a "Modular Monolith". As we scale to **10 million daily API calls** management, we must split it.

### The Split Plan (Target Architecture)

\`\`\`mermaid
graph TD
    classDef mono fill:#ffe0b2,stroke:#ef6c00,stroke-width:2px;
    classDef micro fill:#bbdefb,stroke:#0d47a1,stroke-width:2px;

    User[User Request]

    subgraph Current["Current: Modular Monolith"]
        Mono[Backend Service]:::mono
    end

    subgraph Future["Future: Microservices"]
        Gateway[API Gateway / Ingress]
        
        Svc1[Core Inventory Service]:::micro
        Svc2[ARM/IaC Worker]:::micro
        Svc3[Audit & Compliance Service]:::micro
        Svc4[Policy Intelligence Engine]:::micro
        
        DB1[(Inventory DB)]
        DB2[(Audit DB)]
    end

    User --> Gateway
    Gateway --> Svc1
    Gateway --> Svc4
    
    Svc1 -- "Async Event (ServiceBus)" --> Svc2
    Svc1 -- "Async Event" --> Svc3
    
    Svc1 -.-> DB1
    Svc3 -.-> DB2
\`\`\`

### Why & When to Split?
1.  **ARM Logic (\`teams.service.ts\`):** Azure operations are slow (2-3s). Moving this to a **Worker Queue** pattern allows the API to respond instantly.
2.  **Audit Logs:** High write volume. Dedicated ingestion service prevents blocking the main thread.

---

## 3. Horizontal Scaling & KEDA
How do we handle traffic spikes?

\`\`\`mermaid
graph LR
    Metric[CPU / HTTP Request Count] --> KEDA[KEDA Scaler]
    KEDA -- "Scale Out (1->10)" --> Pods[Backend Pods]
    Pods -- "Load Balance" --> DB[Database Connection Pool]
\`\`\`

*   **Statelessness:** The backend stores NO session state (JWT only). This means we can scale from 1 replica to 50 instantly.
*   **Database Pooling:** We use \`pg-pool\` to ensure that 50 pods don't exhaust the Postgres connection limit (Max 100 connections).
*   **Async Processing:** Heavy jobs (Spec Parsing) are candidates for **Azure Functions** triggered by Event Grid, offloading CPU work from the main API.

---

## 4. JIT Sync Logic (Internal Flow)
The "Just-In-Time" sync is the most CPU-intensive operation in the current monolith.

\`\`\`mermaid
flowchart TD
    Req[User requests API Details] --> Cache{Check Ops Cache?}
    Cache -- Hit --> Return[Return DB Rows]
    Cache -- Miss/Stale --> Fetch[Fetch YAML from ADO]
    
    Fetch --> Parse[SwaggerParser.parse()]
    Parse --> Validate{Spectral Lint Pass?}
    
    Validate -- Valid --> Upsert[Bulk UPSERT to DB]
    Validate -- Invalid --> Error[Mark as Broken]
    
    Upsert --> Return
\`\`\`

## 2. Policy Studio: State Machine Diagram
The Policy Studio is a complex engine that transitions between "Visual" and "Code" states. Ensuring these states never drift is critical.

\`\`\`mermaid
stateDiagram-v2
    [*] --> Loading
    
    Loading --> VisualMode : XML Parsed Successfully
    Loading --> CodeMode : XML Parsing Failed (Fallback)

    state VisualMode {
        [*] --> Idle
        Idle --> Dragging : User Starts Drag
        Dragging --> Dropped : Item Placed
        Dropped --> Regenerating : Trigger XML Gen
        Regenerating --> Idle : State Updated
    }

    state CodeMode {
        [*] --> Typing
        Typing --> Parsing : On Blur / Debounce
        Parsing --> Valid : Structure OK
        Parsing --> Invalid : Syntax Error
        Invalid --> Typing : User Fixes
    }

    VisualMode --> CodeMode : User clicks "View Code"
    CodeMode --> VisualMode : User clicks "Visual Editor" (If Valid)
\`\`\`

---

## 3. Data Flow Sequence: The "Hook Pattern"
We strictly enforce a unidirectional data flow. Components never talk to APIs directly.

\`\`\`mermaid
sequenceDiagram
    participant UI as Component
    participant Hook as useInventory()
    participant Store as Zustand Store
    participant Client as Axios Client
    participant API as Backend Service

    UI->>Hook: loadInventory()
    activate Hook
    Hook->>Store: setIsLoading(true)
    
    Hook->>Client: getProducts()
    activate Client
    Client->>API: GET /v1/products
    API-->>Client: 200 OK [JSON]
    deactivate Client
    
    Client-->>Hook: Data
    Hook->>Store: setProducts(data)
    Hook->>Store: setIsLoading(false)
    deactivate Hook
    
    Store-->>UI: Re-render with Data
\`\`\`

---

## 4. Scaling The Frontend
How do we go from 5 developers to 50?

### Strategy 1: Federation (Module Splitting)
Currently, modules are imported statically. To scale, we can convert \`src/features/*\` into **Webpack Module Federation** remotes.
*   **Team A** owns \`git/inventory-mfe\` -> Deploys \`inventory.js\`.
*   **Team B** owns \`git/policy-mfe\` -> Deploys \`policy.js\`.
*   **App Host** consumes them at runtime.

### Strategy 2: State Isolation
We intentionally avoided a single \`RootState\` type exported from \`store/index.ts\` to prevent circular dependencies.
*   **Rule:** Feature A cannot import Feature B's slice directly.
*   **Communication:** Uses the \`Global Event Bus\` (or lightweight UI slice) for cross-feature signaling (e.g., "Toast Notification").

### Strategy 3: Component Library (Design System)
To maintain consistency at scale, \`src/shared/ui\` should be extracted to a private NPM package (\`@company/ui-kit\`).
*   **Before:** Import local button.
*   **After:** \`import { Button } from '@company/ui-kit'\`.
*   **Benefit:** Versioned breaking changes for UI.
