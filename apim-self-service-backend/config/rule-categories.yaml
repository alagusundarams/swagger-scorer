# Rule Category Mapping v2.0
# Maps Spectral rules to scoring categories

mappings:
  # =========================================
  # AI SECURITY (20%)
  # =========================================
  - pattern: "ai-.*"
    category: "aiSecurity"

  # =========================================
  # SECURITY (30%)
  # =========================================
  - pattern: "owasp.*"
    category: "security"
  - pattern: "security.*"
    category: "security"
  - pattern: ".*auth.*"
    category: "security"
  - pattern: "no-http.*"
    category: "security"
  - pattern: "servers-https.*"
    category: "security"
  - pattern: "no-credentials.*"
    category: "security"
  - pattern: "define-401.*"
    category: "security"
  - pattern: "define-403.*"
    category: "security"
  - pattern: "array-max.*"
    category: "security"
  - pattern: "string-max.*"
    category: "security"
  - pattern: "contact-email.*"
    category: "security"

  # =========================================
  # STRUCTURAL (20%)
  # =========================================
  - pattern: "oas3.*"
    category: "structural"
  - pattern: "info-title"
    category: "structural"
  - pattern: "info-version"
    category: "structural"
  - pattern: "paths-not-empty"
    category: "structural"
  - pattern: "valid-media.*"
    category: "structural"
  - pattern: ".*ref.*"
    category: "structural"
  - pattern: "openapi.*"
    category: "structural"

  # =========================================
  # API DESIGN (20%)
  # =========================================
  - pattern: "operation-operationId.*"
    category: "apiDesign"
  - pattern: "operation-tags"
    category: "apiDesign"
  - pattern: "paths-kebab.*"
    category: "apiDesign"
  - pattern: "no-trailing.*"
    category: "apiDesign"
  - pattern: "server-url.*"
    category: "apiDesign"
  - pattern: "no-example-server"
    category: "apiDesign"
  - pattern: ".*path.*"
    category: "apiDesign"

  # =========================================
  # DOCUMENTATION (15%)
  # =========================================
  - pattern: "info-description"
    category: "documentation"
  - pattern: "info-contact"
    category: "documentation"
  - pattern: "info-license"
    category: "documentation"
  - pattern: "operation-description"
    category: "documentation"
  - pattern: "operation-summary"
    category: "documentation"
  - pattern: "parameter-description"
    category: "documentation"
  - pattern: "tag-description"
    category: "documentation"
  - pattern: "schema-description"
    category: "documentation"
  - pattern: ".*example.*"
    category: "documentation"

  # =========================================
  # DATA MODELS (10%)
  # =========================================
  - pattern: "schema-type.*"
    category: "dataModels"
  - pattern: "typed-enum"
    category: "dataModels"
  - pattern: "array-items.*"
    category: "dataModels"
  - pattern: "valid-format"
    category: "dataModels"
  - pattern: ".*schema.*"
    category: "dataModels"
  - pattern: ".*enum.*"
    category: "dataModels"
  - pattern: ".*component.*"
    category: "dataModels"

  # =========================================
  # ERROR HANDLING (5%)
  # =========================================
  - pattern: "success-response.*"
    category: "errorHandling"
  - pattern: "client-error.*"
    category: "errorHandling"
  - pattern: "server-error.*"
    category: "errorHandling"
  - pattern: ".*response.*"
    category: "errorHandling"

  # Default fallback
  - pattern: ".*"
    category: "structural"
