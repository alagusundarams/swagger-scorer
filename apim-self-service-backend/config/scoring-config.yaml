# Scoring Configuration Version 2.0
# Market-Standard OpenAPI Scoring with 52 Industry Rules

version: "2.0"

# Category Weights (Total: 100%)
# Based on industry standards - Security is highest priority
categories:
  security:
    weight: 30       # OWASP API Security Top 10
    enabled: true

  security:
    weight: 30       # OWASP API Security Top 10
    enabled: true
  
  structural:
    weight: 20       # OpenAPI spec compliance
    enabled: true
  
  apiDesign:
    weight: 20       # RESTful best practices
    enabled: true
  
  documentation:
    weight: 15       # API discoverability
    enabled: true
  
  dataModels:
    weight: 10       # Schema quality
    enabled: true
  
  errorHandling:
    weight: 5        # Response consistency
    enabled: true

# Severity Multipliers
severityMultipliers:
  error: 1.0         # Critical - full deduction
  warning: 0.5       # Important - half deduction
  info: 0.1          # Minor - minimal deduction
  hint: 0.0          # Suggestions - no deduction

# Score Thresholds (RAG Status)
thresholds:
  green: 90          # Excellent quality
  amber: 70          # Needs improvement
  # Score < 70: Poor quality (Red)

# Auth exceptions - endpoints that don't require security
authExceptions:
  - "/health"
  - "/docs"
  - "/openapi.json"
  - "/swagger.json"
